name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.3.0)'
        required: true

jobs:
  # The quality gate, shared with every push and pull request. It runs against the tag being
  # released, and the build job below cannot start until it passes — a release is never the first
  # time the suite has run on this tree, and never publishes past a red one.
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
    secrets: inherit

  build-and-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # For a dispatch, build the tag that was asked for rather than whatever the default branch
      # currently holds — otherwise the version check below would compare against the wrong tree.
      #
      # fetch-depth: 0 because the version *is* the tag: Gradle resolves it with `git describe`, so
      # a shallow checkout with no tag objects would build something numbered after an older
      # release, or 0.0.0.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Fail here with a readable message rather than deep inside Gradle. Without the Firebase
      # config the gms build dies in processGmsReleaseGoogleServices ("File google-services.json is
      # missing"); without the keystore it produces an unsigned artifact.
      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD \
                      SIGNING_STORE_PASSWORD GOOGLE_SERVICES_JSON; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/keystore.jks"
          test -s "$GITHUB_WORKSPACE/keystore.jks" || { echo "::error::keystore decoded empty"; exit 1; }

      - name: Create keystore.properties
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" > keystore.properties
          echo "KEYSTORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> keystore.properties
          echo "KEY_ALIAS=$SIGNING_KEY_ALIAS" >> keystore.properties
          echo "KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> keystore.properties

      # Only the gms flavour needs this; it is gitignored, so CI supplies it. The foss flavour is
      # deliberately buildable without it — that is what makes it F-Droid-eligible.
      - name: Restore Firebase config for the gms flavour
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/gms/google-services.json
          python3 -c "import json,sys; json.load(open('app/src/gms/google-services.json'))" \
            || { echo "::error::GOOGLE_SERVICES_JSON did not decode to valid JSON"; exit 1; }

      # Runs before the two long builds so a bad tag fails in seconds rather than twenty minutes.
      # Gradle is asked for the version instead of the workflow re-deriving it, so the tag-to-
      # versionCode rule lives in exactly one place. Gradle derives the version from the tag, so
      # this is not a drift check any more — it catches a checkout whose tag objects are missing,
      # where `git describe` would silently answer with an older release.
      - name: Resolve version and check it matches the tag
        id: version
        run: |
          chmod +x gradlew
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac

          ./gradlew -q :app:printVersion \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64 > version.txt

          NAME=$(sed -n 's/^versionName=//p' version.txt)
          CODE=$(sed -n 's/^versionCode=//p' version.txt)
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error::could not read the version from Gradle"
            cat version.txt
            exit 1
          fi

          if [ "v$NAME" != "$TAG" ]; then
            echo "::error::Gradle resolved version '$NAME', but this run is releasing '$TAG'."
            echo "::error::The version comes from the tag via 'git describe', so this means the"
            echo "::error::checkout is missing its tag objects. Check that the Checkout step still"
            echo "::error::sets fetch-depth: 0, and that '$TAG' exists on the remote."
            exit 1
          fi

          echo "Releasing $NAME (versionCode $CODE) as $TAG"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # F-Droid names a changelog after the versionCode and shows nothing when the file is absent.
      # It is read from the tagged commit, so it cannot be added afterwards — a release that ships
      # without one has no "what's new" until the release after it. This is the only step of the
      # release that would otherwise fail silently, so it fails here instead.
      - name: Check the store changelog for this version
        run: |
          file="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt"
          if [ ! -s "$file" ]; then
            echo "::error::$file is missing. Write it before tagging ${{ steps.version.outputs.tag }}."
            exit 1
          fi
          chars=$(tr -d '\n' < "$file" | wc -c | tr -d ' ')
          if [ "$chars" -gt 500 ]; then
            echo "::error::$file is $chars characters; F-Droid and Play both cap it at 500."
            exit 1
          fi
          echo "$file ok ($chars characters)"

      # Flavours are built as separate tasks: `assembleRelease` would build both at once and the two
      # dex merges together exhaust the default daemon heap.
      - name: Build FOSS APK
        run: |
          ./gradlew :app:assembleFossRelease \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

      - name: Build Play APK and bundle
        run: |
          ./gradlew :app:assembleGmsRelease :app:bundleGmsRelease \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

      - name: Verify the FOSS build carries no proprietary code
        run: |
          apk=app/build/outputs/apk/foss/release/app-foss-release.apk
          if unzip -l "$apk" | grep -qiE "barhopper|mlkit|play-services|firebase"; then
            echo "::error::FOSS APK contains proprietary Google code — not F-Droid eligible"
            unzip -l "$apk" | grep -iE "barhopper|mlkit|play-services|firebase"
            exit 1
          fi
          echo "FOSS APK is clean."

      # Gradle's output names carry no version, so every release would otherwise offer three files
      # called app-foss-release.apk and they would collide in a downloads folder.
      - name: Name the artifacts after the version
        env:
          V: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "release/solidshare-$V-foss.apk"
          cp app/build/outputs/apk/gms/release/app-gms-release.apk "release/solidshare-$V-gms.apk"
          cp app/build/outputs/bundle/gmsRelease/app-gms-release.aab "release/solidshare-$V-gms.aab"
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/solidshare-${{ steps.version.outputs.name }}-foss.apk
            release/solidshare-${{ steps.version.outputs.name }}-gms.apk
            release/solidshare-${{ steps.version.outputs.name }}-gms.aab
